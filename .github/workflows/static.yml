name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache-Busting-Version setzen
        # Ersetzt "?v=..." in index.html durch den Commit-Hash dieses Deploys, damit
        # Browser bei jedem Push automatisch die neuen Dateien laden (kein manuelles
        # Hochzählen der Versionsnummer im Code mehr nötig).
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s/?v=[a-zA-Z0-9]\+/?v=$SHA_SHORT/g" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
